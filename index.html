 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post App</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ================= SIGN UP ================= -->

  <div id="signUpFormContainer" class="card p-4 shadow-lg rounded-4" style="width:30rem;">

    <h2 class="text-center mb-3">
      <img class="logo" src="Images/logo.png" alt="">
      Create Your Account
    </h2>

    <form id="signUpForm">

      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">First Name</label>
          <input
            required
            type="text"
            class="form-control"
            id="inputFirstName"
          >
        </div>

        <div class="col-md-6">
          <label class="form-label">Last Name</label>
          <input
            required
            type="text"
            class="form-control"
            id="inputLastName"
          >
        </div>

        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input
            required
            type="email"
            class="form-control"
            id="inputEmail4"
          >
        </div>

        <div class="col-md-6">
          <label class="form-label">Password</label>
          <input
            required
            type="password"
            class="form-control"
            id="inputPassword4"
          >
        </div>

        <div class="col-12">
          <label class="form-label">Phone</label>

          <input
            required
            type="number"
            class="form-control"
            placeholder="####-######"
            id="inputAddress"
          >
        </div>

        <div class="col-md-6">
          <label class="form-label">City</label>

          <input
            required
            type="text"
            class="form-control"
            id="inputCity"
          >
        </div>

        <div class="col-12">

          <div class="form-check">

            <input
              class="form-check-input"
              type="checkbox"
              id="gridCheck"
            >

            <label class="form-check-label" for="gridCheck">
              Remember me
            </label>

          </div>

        </div>

        <div class="col-12 text-center">

          <button
            type="submit"
            class="btn bg-color text-white w-100 py-2 fw-semibold rounded-3"
          >
            Sign Up
          </button>

        </div>

      </div>

    </form>

  </div>

  <!-- ================= POST APP ================= -->

  <div id="postApp" class="hidden">

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-light shadow-sm">

      <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="#">
          <img class="logo" src="Images/logo.png" alt="">
          Post App
        </a>

        <div class="profile-photo">

          <img
            id="profilePhotoImg"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Default_pfp.svg/2048px-Default_pfp.svg.png"
          >

          <input
            type="file"
            id="profilePhotoInput"
            accept="image/*"
            hidden
          >

        </div>

      </div>

    </nav>

    <div class="container mt-4">

      <!-- Search -->

      <div class="row mb-4">

        <div class="col-lg-6 mx-auto">

          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Search posts..."
            onkeyup="searchPosts()"
          >

        </div>

      </div>

      <div class="row">

        <!-- LEFT SIDE -->

        <div class="col-lg-4">

          <div class="card p-3 shadow rounded-4">

            <div class="mb-3">

              <label class="form-label fw-semibold">
                Title
              </label>

              <input
                id="title"
                class="form-control"
                type="text"
              >

            </div>

            <div class="mb-3">

              <label class="form-label fw-semibold">
                Description
              </label>

              <textarea
                id="description"
                rows="4"
                class="form-control"
              ></textarea>

            </div>

            <!-- Background Images -->

            <div class="mb-3">

              <label class="form-label fw-semibold">
                Select Background
              </label>

              <div class="images">

                <img
                  src="Images/background 1.jpg"
                  class="bg-img selectedImg"
                  onclick="selectBackground(this)"
                >

                <img
                  src="Images/background 2.jpg"
                  class="bg-img"
                  onclick="selectBackground(this)"
                >

                <img
                  src="Images/background 3.jpg"
                  class="bg-img"
                  onclick="selectBackground(this)"
                >

                <img
                  src="Images/background 4.jpg"
                  class="bg-img"
                  onclick="selectBackground(this)"
                >

                <img
                  src="Images/background 5.jpg"
                  class="bg-img"
                  onclick="selectBackground(this)"
                >

              </div>

            </div>

            <div class="text-end">

              <button
                onclick="post()"
                class="btn postBtn px-4"
              >
                Post
              </button>

            </div>

          </div>

        </div>

        <!-- POSTS -->

        <div
          class="col-lg-8"
          id="post"
        ></div>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script
    type="module"
    src="auth.js"
  ></script>

</body>
</html>
